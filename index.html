<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>subshark</title>
<meta name="description" content="projects">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400&family=Urbanist:wght@800&display=swap" rel="stylesheet">
<style>
  /* Light only: the brand colours are tuned for light grounds. */
  :root { --bg: #faf9f6; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e4e2dc; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 17px/1.55 system-ui, -apple-system, sans-serif; }
  main { max-width: 36rem; margin: 0 auto; padding: 5rem 1rem; }
  h1 { font-size: 1rem; font-weight: 400; color: var(--muted); margin: 2.575rem 0 3rem; } /* where it sat under the old name */
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid var(--line); }
  li:last-child { border-bottom: 1px solid var(--line); }
  a { display: flex; align-items: center; height: 5.5rem; text-decoration: none; }
  a:hover, a:focus-visible { background: #f1efe9; }
  /* Each wordmark as its own site sets it. */
  .onnbon { font: 400 2.4rem/1 Jost, Futura, sans-serif; color: #941100; }
  .plumcha { font: 800 2.4rem/1 Urbanist, sans-serif; letter-spacing: -0.02em; }
  .plumcha b:first-child { color: #7a4e7b; } .plumcha b:last-child { color: #3d63a0; }
  .plumcha b { font-weight: inherit; }
  .nimtin { height: 2.6rem; margin-left: -.25rem; } /* svg carries its own padding */
</style>
</head>
<body>
<main>
  <h1>projects</h1>
  <ul>
    <li><a href="https://www.onnbon.com"><span class="onnbon">onnbon</span></a></li>
    <li><a href="https://www.plumcha.com" aria-label="plumcha"><span class="plumcha"><b>plum</b><b>cha</b></span></a></li>
    <li><a href="https://www.nimtin.com"><img class="nimtin" src="nimtin.svg" alt="nimtin"></a></li>
  </ul>
</main>
</body>
</html>
